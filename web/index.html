<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Konum Doğrulamalı Check-in</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #0f172a;

    }

    .card {

        0 15px 45px rgba(0, 0, 0, 0.4);

<body>

  <div class="card">

    <h1>
      📍 Konum Doğrulamalı Check-in
    </h1>

    <p class="sub">
      Bulunduğunuz konumdaki ESP32 cihazına
      Bluetooth ile bağlanarak yoklamanızı
      onaylayın.
    </p>


    <!-- Tarayıcı uyarısı -->

    <div
      id="compatWarning"
      class="warn-box"
      style="display:none;"
    >
      ⚠️ Bu tarayıcı Web Bluetooth desteklemiyor.
      Android üzerinde Chrome kullanmanız gerekir.
    </div>


    <!-- İsim -->

    <input
      type="text"
      id="employeeName"
      placeholder="Adınız Soyadınız"
      autocomplete="name"
      maxlength="100"
    >


    <!-- Bluetooth -->

    <button
      id="scanBtn"
      type="button"
    >
      Bluetooth ile Konumu Doğrula
    </button>


    <!-- Durum -->

    <div id="status"></div>


    <div class="details">
      Bluetooth → ESP32 → Cloudflare Worker → D1
    </div>

  </div>


<script>

/* =========================================================
   BLUETOOTH AYARLARI
   ========================================================= */

const SERVICE_UUID =
  "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

const LOCATION_CHAR_UUID =
  "6e400002-b5a3-f393-e0a9-e50e24dcca9e";


/* =========================================================
   CLOUDFLARE WORKER
   ========================================================= */

const CHECKIN_ENDPOINT =
  "https://esp32-checkin-backend.erenkaraca2005.workers.dev/checkin";


/* =========================================================
   HTML ELEMANLARI
   ========================================================= */

const scanBtn =
  document.getElementById("scanBtn");

const statusEl =
  document.getElementById("status");

const nameInput =
  document.getElementById("employeeName");

const compatWarning =
  document.getElementById("compatWarning");


/* =========================================================
   DURUM MESAJI
   ========================================================= */

function setStatus(message, type) {

  statusEl.textContent = message;

  statusEl.className = type;

}


/* =========================================================
   TARAYICI KONTROLLERİ
   ========================================================= */

if (!window.isSecureContext) {

  setStatus(
    "❌ Bu sayfa HTTPS üzerinden açılmalıdır. Web Bluetooth güvenli bağlantı gerektirir.",
    "err"
  );

}


if (!navigator.bluetooth) {

  compatWarning.style.display =
    "block";

  scanBtn.disabled =
    true;

}


/* =========================================================
   CHECK-IN BAŞLAT
   ========================================================= */

scanBtn.addEventListener(
  "click",
  startCheckin
);


async function startCheckin() {

  const employeeName =
    nameInput.value.trim();


  /* İsim kontrolü */

  if (!employeeName) {

    setStatus(
      "❌ Lütfen önce adınızı ve soyadınızı girin.",
      "err"
    );

    nameInput.focus();

    return;
  }


  scanBtn.disabled =
    true;


  let device =
    null;


  try {

    /* -----------------------------------------
       1. Bluetooth taraması
       ----------------------------------------- */

    setStatus(
      "🔎 Yakındaki Bluetooth cihazları taranıyor...",
      "info"
    );


    device =
      await navigator.bluetooth.requestDevice({

        filters: [
          {
            services: [
              SERVICE_UUID
            ]
          }
        ],

        optionalServices: [
          SERVICE_UUID
        ]

      });


    /* -----------------------------------------
       2. ESP32 bağlantısı
       ----------------------------------------- */

    setStatus(
      "🔗 ESP32 cihazına bağlanılıyor...",
      "info"
    );


    if (
      !device.gatt
    ) {

      throw new Error(
        "Bluetooth GATT bağlantısı kullanılamıyor."
      );

    }


    const server =
      await device.gatt.connect();


    /* -----------------------------------------
       3. Bluetooth servisi
       ----------------------------------------- */

    const service =
      await server.getPrimaryService(
        SERVICE_UUID
      );


    /* -----------------------------------------
       4. Konum karakteristiği
       ----------------------------------------- */

    const characteristic =
      await service.getCharacteristic(
        LOCATION_CHAR_UUID
      );


    /* -----------------------------------------
       5. Konumu oku
       ----------------------------------------- */

    const value =
      await characteristic.readValue();


    const decoder =
      new TextDecoder(
        "utf-8"
      );


    const locationId =
      decoder
        .decode(value)
        .replace(/\0/g, "")
        .trim();


    if (!locationId) {

      throw new Error(
        "ESP32 konum bilgisi boş gönderdi."
      );

    }


    /* -----------------------------------------
       6. Bluetooth başarılı
       ----------------------------------------- */

    setStatus(
      "✅ Bluetooth doğrulama başarılı.\n" +
      "Konum: " +
      locationId +
      "\n\n" +
      "☁️ Sunucuya gönderiliyor...",
      "info"
    );


    /* -----------------------------------------
       7. Cloudflare Worker
       ----------------------------------------- */

    await sendCheckin(
      employeeName,
      locationId
    );


  }

  catch (error) {

    console.error(
      "CHECK-IN ERROR:",
      error
    );


    if (
      error.name ===
      "NotFoundError"
    ) {

      setStatus(
        "❌ Bluetooth cihazı seçilmedi veya bulunamadı.",
        "err"
      );

    }

    else if (
      error.name ===
      "SecurityError"
    ) {

      setStatus(
        "❌ Bluetooth erişimi engellendi. Tarayıcı izinlerini ve HTTPS bağlantısını kontrol edin.",
        "err"
      );

    }

    else if (
      error.name ===
      "NetworkError"
    ) {

      setStatus(
        "❌ Bluetooth bağlantısı sırasında ağ hatası oluştu.",
        "err"
      );

    }

    else {

      setStatus(
        "❌ " +
        (
          error.message ||
          String(error)
        ),
        "err"
      );

    }

  }


  finally {

    /* -----------------------------------------
       Bluetooth bağlantısını kapat
       ----------------------------------------- */

    try {

      if (
        device &&
        device.gatt &&
        device.gatt.connected
      ) {

        device.gatt.disconnect();

      }

    }

    catch (_) {}


    scanBtn.disabled =
      false;

  }

}


/* =========================================================
   CLOUDFLARE CHECK-IN
   ========================================================= */

async function sendCheckin(
  employeeName,
  locationId
) {


  const payload = {

    employeeName:
      employeeName,

    locationId:
      locationId,

    timestamp:
      new Date().toISOString(),

    source:
      "web-bluetooth"

  };


  let response;


  try {

    /*
     * ÖNEMLİ
     *
     * application/json yerine text/plain kullanıyoruz.
     *
     * Body'nin kendisi yine JSON'dur.
     *
     * Cloudflare Worker tarafında:
     *
     * await request.json()
     *
     * bunu okuyabilir.
     *
     * text/plain kullanılması tarayıcı tarafındaki
     * CORS preflight sorununu azaltır.
     */

    response =
      await fetch(
        CHECKIN_ENDPOINT,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=UTF-8"

          },

          body:
            JSON.stringify(
              payload
            ),

          cache:
            "no-store"

        }
      );

  }

  catch (networkError) {

    console.error(
      "WORKER FETCH ERROR:",
      networkError
    );


    throw new Error(
      "Sunucuya bağlanılamadı: " +
      (
        networkError.message ||
        "Failed to fetch"
      )
    );

  }


  /* =====================================================
     SUNUCU CEVABI
     ===================================================== */

  const responseText =
    await response.text();


  let data =
    null;


  try {

    data =
      responseText
        ? JSON.parse(
            responseText
          )
        : null;

  }

  catch (_) {

    data =
      null;

  }


  /* =====================================================
     HTTP HATASI
     ===================================================== */

  if (
    !response.ok
  ) {

    throw new Error(

      (
        data &&
        data.error
      )

      ||

      (
        "Sunucu hatası: HTTP " +
        response.status
      )

    );

  }


  /* =====================================================
     API BAŞARI KONTROLÜ
     ===================================================== */

  if (
    !data ||
    data.ok !== true
  ) {

    throw new Error(

      (
        data &&
        data.error
      )

      ||

      "Sunucu geçerli bir başarı yanıtı vermedi."

    );

  }


  /* =====================================================
     BAŞARILI
     ===================================================== */

  setStatus(

    "✅ CHECK-IN BAŞARILI!\n\n" +
    "Personel: " +
    employeeName +
    "\n" +
    "Konum: " +
    locationId,

    "ok"

  );

}

</script>

</body>
</html>
