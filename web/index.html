<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konum Doğrulamalı Check-in</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }

  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 32px 24px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }

  h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }

  p.sub {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 24px;
    line-height: 1.5;
  }

  input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 15px;
    margin-bottom: 16px;
  }

  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
  }

  #scanBtn {
    background: #3b82f6;
    color: white;
  }

  #scanBtn:disabled {
    background: #475569;
    cursor: not-allowed;
  }

  #status {
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.45;
    display: none;
  }

  .ok {
    background: #14532d;
    color: #bbf7d0;
    display: block !important;
  }

  .err {
    background: #7f1d1d;
    color: #fecaca;
    display: block !important;
  }

  .info {
    background: #1e3a5f;
    color: #bfdbfe;
    display: block !important;
  }

  .warn-box {
    background: #422006;
    color: #fde68a;
    font-size: 12px;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 20px;
    line-height: 1.4;
  }
</style>
</head>

<body>

<div class="card">

  <h1>📍 Konum Doğrulamalı Check-in</h1>

  <p class="sub">
    Bulunduğunuz konumdaki cihaza Bluetooth ile bağlanarak
    yoklamanızı onaylayın.
  </p>

  <div
    class="warn-box"
    id="compatWarning"
    style="display:none;"
  >
    ⚠️ Bu tarayıcı Web Bluetooth desteklemiyor.
    Android'de Chrome kullanmanız gerekir.
  </div>

  <input
    type="text"
    id="employeeName"
    placeholder="Adınız Soyadınız"
    autocomplete="name"
  >

  <button id="scanBtn">
    Bluetooth ile Konumu Doğrula
  </button>

  <div id="status"></div>

</div>

<script>

const SERVICE_UUID =
  "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

const LOCATION_CHAR_UUID =
  "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

/*
 * Cloudflare Worker API
 *
 * ÖNEMLİ:
 * Eski dosyada burada:
 *
 * https://api.sizin-alan-adiniz.com/checkin
 *
 * yazıyordu.
 *
 * Artık gerçek Worker adresini kullanıyoruz.
 */

const CHECKIN_ENDPOINT =
  "https://esp32-checkin-backend.erenkaraca2005.workers.dev/checkin";


const scanBtn =
  document.getElementById("scanBtn");

const statusEl =
  document.getElementById("status");

const nameInput =
  document.getElementById("employeeName");

const compatWarning =
  document.getElementById("compatWarning");


function setStatus(message, type) {

  statusEl.textContent = message;
  statusEl.className = type;

}


if (!window.isSecureContext) {

  setStatus(
    "Bu sayfa HTTPS üzerinden açılmalıdır. Web Bluetooth güvenli bağlantı gerektirir.",
    "err"
  );

}


if (!navigator.bluetooth) {

  compatWarning.style.display = "block";
  scanBtn.disabled = true;

}


scanBtn.addEventListener("click", async () => {

  const employeeName =
    nameInput.value.trim();


  if (!employeeName) {

    setStatus(
      "Lütfen önce adınızı girin.",
      "err"
    );

    nameInput.focus();

    return;
  }


  scanBtn.disabled = true;

  let device = null;


  try {

    setStatus(
      "Yakındaki Bluetooth cihazları taranıyor...",
      "info"
    );


    device =
      await navigator.bluetooth.requestDevice({

        filters: [
          {
            services: [SERVICE_UUID]
          }
        ],

        optionalServices: [
          SERVICE_UUID
        ]

      });


    setStatus(
      "Cihaza bağlanılıyor: " +
      (device.name || "Bilinmeyen cihaz") +
      "...",
      "info"
    );


    const server =
      await device.gatt.connect();


    const service =
      await server.getPrimaryService(
        SERVICE_UUID
      );


    const characteristic =
      await service.getCharacteristic(
        LOCATION_CHAR_UUID
      );


    const value =
      await characteristic.readValue();


    const decoder =
      new TextDecoder("utf-8");


    const locationId =
      decoder
        .decode(value)
        .replace(/\0/g, "")
        .trim();


    if (!locationId) {

      throw new Error(
        "ESP32 konum bilgisi boş gönderdi."
      );

    }


    setStatus(
      "Konum doğrulandı: " +
      locationId +
      ". Sunucuya gönderiliyor...",
      "info"
    );


    await sendCheckin(
      employeeName,
      locationId
    );


  } catch (error) {

    console.error(
      "Check-in hatası:",
      error
    );


    if (error.name === "NotFoundError") {

      setStatus(
        "Cihaz seçilmedi veya bulunamadı. ESP32 cihazına yakın olduğunuzdan emin olun.",
        "err"
      );

    }

    else if (
      error.name === "SecurityError"
    ) {

      setStatus(
        "Tarayıcı Bluetooth erişimini engelledi. HTTPS ve Bluetooth izinlerini kontrol edin.",
        "err"
      );

    }

    else {

      setStatus(
        "Hata: " +
        (error.message || error),
        "err"
      );

    }


  } finally {

    try {

      if (
        device &&
        device.gatt &&
        device.gatt.connected
      ) {

        device.gatt.disconnect();

      }

    } catch (_) {}


    scanBtn.disabled = false;

  }

});


async function sendCheckin(
  employeeName,
  locationId
) {


  const payload = {

    employeeName:
      employeeName,

    locationId:
      locationId,

    timestamp:
      new Date().toISOString(),

    source:
      "web-bluetooth"

  };


  let response;


  try {

    response =
      await fetch(
        CHECKIN_ENDPOINT,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(payload)

        }
      );

  }

  catch (networkError) {

    throw new Error(
      "Sunucuya bağlanılamadı: " +
      networkError.message
    );

  }


  const text =
    await response.text();


  let data = null;


  try {

    data =
      text
        ? JSON.parse(text)
        : null;

  }

  catch (_) {}


  if (!response.ok) {

    throw new Error(

      (data && data.error) ||

      (
        "Sunucu hatası: HTTP " +
        response.status
      )

    );

  }


  if (
    !data ||
    data.ok !== true
  ) {

    throw new Error(

      (data && data.error) ||

      "Sunucu geçerli bir başarı yanıtı vermedi."

    );

  }


  setStatus(

    "✅ Check-in başarılı! Konum: " +
    locationId,

    "ok"

  );

}

</script>

</body>
</html>
